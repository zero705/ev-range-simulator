name: CI

on:
  push:
  pull_request:
  schedule:
    # Monthly: re-read the EPA certificates and the regulations at their source ("sources").
    - cron: "0 6 1 * *"

# The workflow only reads the repository: it publishes nothing and uses no secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps them current.
jobs:
  lint:
    name: Lint, security lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint (including the flake8-bandit security rules)
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (model, documents and app)
        run: pytest --cov --cov-report=term-missing
      - name: Documents match the model
        run: python tools/update_docs.py --check
      - name: Drive cycles match the regulators' figures
        run: python tools/check_cycles.py

  deployment:
    name: App with its pinned deployment requirements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exactly what Streamlit Community Cloud installs, and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Test everything but the figures (matplotlib is not part of the app)
        run: pytest --ignore=tests/test_figures.py

  sources:
    name: EPA certificates and drive cycles re-read at the source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Depends on external websites, so it reports rather than failing the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Download the reports, check their fingerprints and re-extract every value
        run: python tools/epa_certification.py --download
      - name: The data file is exactly what the reports say
        run: git diff --exit-code data/epa_certification.json
      - name: Download the regulations and compare the drive cycles second by second
        run: python tools/verify_cycles.py --download

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reports known vulnerabilities in the dependency tree. It does not fail the build:
    # a new advisory upstream is news to act on, not a reason to mark the code broken.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Audit the development environment
        run: pip-audit --skip-editable
      - name: Audit the app's deployment requirements
        run: pip-audit -r requirements.txt
